<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Finanzplaner</title>
  <meta name="description" content="Haushaltsbuch mit Fixkosten, Wochen-Erfassung und Monatsprognose – Daten nur lokal">
  <meta name="theme-color" content="#26262a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="brand-star" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-coin"/></svg>
      <span class="brand-name">Finanzplaner</span>
    </div>
  </header>

  <main id="main">
    <section class="view" id="view-overview" data-view="overview"></section>
    <section class="view" id="view-week" data-view="week" hidden></section>
    <section class="view" id="view-fixed" data-view="fixed" hidden></section>
    <section class="view" id="view-stats" data-view="stats" hidden></section>
    <section class="view" id="view-more" data-view="more" hidden></section>
    <div class="boot" id="boot">
      <svg class="gear spin" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-gear"/></svg>
      <div class="boot-msg" id="boot-msg" hidden></div>
    </div>
  </main>

  <nav class="tabbar" aria-label="Hauptnavigation">
    <button class="tab" data-tab="overview" aria-label="Übersicht">
      <svg viewBox="0 0 24 24"><use href="#i-home"/></svg><span>Übersicht</span>
    </button>
    <button class="tab" data-tab="week" aria-label="Woche">
      <svg viewBox="0 0 24 24"><use href="#i-week"/></svg><span>Woche</span>
    </button>
    <button class="tab" data-tab="fixed" aria-label="Fixkosten">
      <svg viewBox="0 0 24 24"><use href="#i-repeat"/></svg><span>Fixkosten</span>
    </button>
    <button class="tab" data-tab="stats" aria-label="Auswertung">
      <svg viewBox="0 0 24 24"><use href="#i-chart"/></svg><span>Auswertung</span>
    </button>
    <button class="tab" data-tab="more" aria-label="Mehr">
      <svg viewBox="0 0 24 24"><use href="#i-more"/></svg><span>Mehr</span>
    </button>
  </nav>

  <div class="sheet-wrap" id="sheet-wrap" hidden>
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-head">
        <h2 class="sheet-title" id="sheet-title"></h2>
        <button class="icon-btn" data-close aria-label="Schließen"><svg viewBox="0 0 24 24"><use href="#i-close"/></svg></button>
      </div>
      <div class="sheet-body" id="sheet-body"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-gear" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M10.3 1h3.4l.5 2.9a8.6 8.6 0 0 1 2.2.9l2.4-1.7 2.4 2.4-1.7 2.4c.4.7.7 1.4.9 2.2l2.9.5v3.4l-2.9.5a8.6 8.6 0 0 1-.9 2.2l1.7 2.4-2.4 2.4-2.4-1.7c-.7.4-1.4.7-2.2.9l-.5 2.9h-3.4l-.5-2.9a8.6 8.6 0 0 1-2.2-.9l-2.4 1.7-2.4-2.4 1.7-2.4a8.6 8.6 0 0 1-.9-2.2L1 13.7v-3.4l2.9-.5c.2-.8.5-1.5.9-2.2L3.1 5.2l2.4-2.4 2.4 1.7c.7-.4 1.4-.7 2.2-.9zM12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/></symbol>
      <symbol id="i-chart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 21h18"/><path d="M6 17v-6M11 17V5M16 17v-9M21 17v-3"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
      <symbol id="i-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 15l7-7 7 7"/></symbol>
      <symbol id="i-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></symbol>
      <symbol id="i-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></symbol>
      <symbol id="i-cal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></symbol>
      <symbol id="i-coin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><ellipse cx="12" cy="6.5" rx="7.5" ry="3"/><path d="M4.5 6.5v5c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3v-5M4.5 11.5v5c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3v-5"/></symbol>
      <symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"/><path d="M5 20v-6M10 20V9M15 20v-4M20 20V5"/><path d="M4 9l5-5 4 4 7-5" stroke-width="1.5"/></symbol>
      <symbol id="i-week" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4M7 14h2M11 14h2M15 14h2M7 17h2"/></symbol>
      <symbol id="i-repeat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11V9a3 3 0 0 1 3-3h12l-3-3M20 13v2a3 3 0 0 1-3 3H5l3 3"/></symbol>
      <symbol id="i-more" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></symbol>
      <symbol id="i-bank" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M3 9.5L12 4l9 5.5H3z"/><path d="M5 10v7.5M9.7 10v7.5M14.3 10v7.5M19 10v7.5M3 20.5h18"/></symbol>
    </defs>
  </svg>

  <script>
    // Start-Hilfe: falls die App nicht hochkommt, Erklärung + Notfall-Knöpfe statt endlosem Zahnrad
    (function () {
      var msg = function (html) {
        var el = document.getElementById('boot-msg');
        if (!el || !document.getElementById('boot')) return;
        el.innerHTML = html + '<div class="btn-row" style="margin-top:14px"><button class="btn" id="boot-reload">Neu laden</button></div>';
        el.hidden = false;
        document.getElementById('boot-reload').onclick = function () { location.reload(); };
      };
      window.addEventListener('finanzplaner-db-blocked', function () {
        msg('<b>Update wartet</b><p>Der Finanzplaner ist noch in einer älteren Version geöffnet (anderer Tab oder installierte App). Bitte dort schließen.</p>');
      });
      setTimeout(function () { msg('<b>Der Start dauert ungewöhnlich lange.</b><p>Ist der Finanzplaner noch in einem anderen Tab offen? Sonst hilft „Neu laden“.</p>'); }, 10000);
    })();
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
