<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tagesplan</title>
  <meta name="description" content="Kalorien- und Makro-Tracker">
  <meta name="theme-color" content="#C8102E">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="brand-star" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-star"/></svg>
      <span class="brand-name">Tagesplan</span>
    </div>
    <div class="topbar-sub" id="topbar-sub"></div>
  </header>

  <main id="main">
    <section class="view" id="view-today" data-view="today"></section>
    <section class="view" id="view-foods" data-view="foods" hidden></section>
    <section class="view" id="view-stats" data-view="stats" hidden></section>
    <section class="view" id="view-goals" data-view="goals" hidden></section>
    <div class="boot" id="boot">
      <svg class="gear spin" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-gear"/></svg>
    </div>
  </main>

  <nav class="tabbar" aria-label="Hauptnavigation">
    <button class="tab" data-tab="today" aria-label="Heute">
      <svg viewBox="0 0 24 24"><use href="#i-sun"/></svg><span>Heute</span>
    </button>
    <button class="tab" data-tab="foods" aria-label="Lebensmittel">
      <svg viewBox="0 0 24 24"><use href="#i-list"/></svg><span>Lebensmittel</span>
    </button>
    <button class="tab" data-tab="stats" aria-label="Auswertung">
      <svg viewBox="0 0 24 24"><use href="#i-chart"/></svg><span>Auswertung</span>
    </button>
    <button class="tab" data-tab="goals" aria-label="Ziele">
      <svg viewBox="0 0 24 24"><use href="#i-target"/></svg><span>Ziele</span>
    </button>
  </nav>

  <div class="sheet-wrap" id="sheet-wrap" hidden>
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-head">
        <h2 class="sheet-title" id="sheet-title"></h2>
        <button class="icon-btn" data-close aria-label="Schließen"><svg viewBox="0 0 24 24"><use href="#i-close"/></svg></button>
      </div>
      <div class="sheet-body" id="sheet-body"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 1.8l2.9 7.2 7.7.5-5.9 5 1.9 7.5L12 17.9 5.4 22l1.9-7.5-5.9-5 7.7-.5z"/></symbol>
      <symbol id="i-gear" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M10.3 1h3.4l.5 2.9a8.6 8.6 0 0 1 2.2.9l2.4-1.7 2.4 2.4-1.7 2.4c.4.7.7 1.4.9 2.2l2.9.5v3.4l-2.9.5a8.6 8.6 0 0 1-.9 2.2l1.7 2.4-2.4 2.4-2.4-1.7c-.7.4-1.4.7-2.2.9l-.5 2.9h-3.4l-.5-2.9a8.6 8.6 0 0 1-2.2-.9l-2.4 1.7-2.4-2.4 1.7-2.4a8.6 8.6 0 0 1-.9-2.2L1 13.7v-3.4l2.9-.5c.2-.8.5-1.5.9-2.2L3.1 5.2l2.4-2.4 2.4 1.7c.7-.4 1.4-.7 2.2-.9zM12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/></symbol>
      <symbol id="i-wheat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M12 23V7"/><path d="M12 7c0-2 1-3.5 0-5.5-1 2-0 3.5 0 5.5z"/><path d="M12 11c-2.5 0-4-1.2-4.6-3.6 2.4.2 4 1.4 4.6 3.6zM12 11c2.5 0 4-1.2 4.6-3.6-2.4.2-4 1.4-4.6 3.6zM12 15c-2.5 0-4-1.2-4.6-3.6 2.4.2 4 1.4 4.6 3.6zM12 15c2.5 0 4-1.2 4.6-3.6-2.4.2-4 1.4-4.6 3.6zM12 19c-2.5 0-4-1.2-4.6-3.6 2.4.2 4 1.4 4.6 3.6zM12 19c2.5 0 4-1.2 4.6-3.6-2.4.2-4 1.4-4.6 3.6z"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></symbol>
      <symbol id="i-list" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3.5 6h.01M3.5 12h.01M3.5 18h.01" stroke-width="3"/></symbol>
      <symbol id="i-chart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 21h18"/><path d="M6 17v-6M11 17V5M16 17v-9M21 17v-3"/></symbol>
      <symbol id="i-target" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></symbol>
      <symbol id="i-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></symbol>
      <symbol id="i-cal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="8" y="8" width="12.5" height="12.5" rx="2"/><path d="M16 8V5.5A2 2 0 0 0 14 3.5H5.5a2 2 0 0 0-2 2V14a2 2 0 0 0 2 2H8"/></symbol>
    </defs>
  </svg>

  <script type="module" src="js/app.js"></script>
</body>
</html>
